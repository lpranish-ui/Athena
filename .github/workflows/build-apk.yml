# Builds a ready-to-install Android APK on GitHub's servers (free - no Expo account needed).
#
# Where to get the APK:
#   Direct link (always the newest build):
#     https://github.com/lpranish-ui/Athena/releases/download/apk-latest/app-release.apk
#   Or: repo -> Actions -> "Build Android APK" -> latest run -> Artifacts.
#
# Runs automatically when app code changes on main, or manually from the
# Actions tab (workflow_dispatch). First build takes ~15 min.
#
# The APK is signed with the default debug key, which is perfect for
# installing directly on a phone. (A Play-Store release would need its own
# keystore - add that later when publishing.)

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'tests/**'
      - 'worker/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: athena
          POSTGRES_PASSWORD: athena-test
          POSTGRES_DB: athena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U athena -d athena_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://athena:athena-test@localhost:5432/athena_test
      DATABASE_URL: postgresql://athena:athena-test@localhost:5432/athena_test
      EXPO_PUBLIC_API_URL: http://localhost:10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s worker -p 'test_*.py'
      - run: npm run audit:dependencies
      - run: npm audit --prefix server --omit=dev

  build-apk:
    needs: validate
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://athena-api-w018.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # Caches the Gradle distribution, dependencies and build outputs between
      # runs — the first build is slow (cold cache), later builds are 3-4x faster.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --stacktrace --build-cache -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish rolling release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Athena APK (latest)
          body: Built automatically from the latest main branch.
          files: android/app/build/outputs/apk/release/app-release.apk
